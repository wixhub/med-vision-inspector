<div class="inspector-layout">
  <!-- Sidebar Control Panel Component -->
  <app-sidebar
    [state]="state()"
    (fileSelected)="onFileSelected($event)"
    (processImage)="processImage()"
  />

  <!-- Main Viewer Workspace with Interactive Canvas -->
  <main class="app-main">
    <div class="canvas-wrapper">
      @if (state().isLoading && !state().resultImageUrl) {
        <div class="loading-overlay">
          <div class="spinner-large"></div>
          <p>Executing ResNet18 Grad-CAM forward & backward pass...</p>
        </div>
      }

      @if (state().resultImageUrl || state().previewUrl) {
        <div class="zoom-hint">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          <span>Scroll to Zoom / Drag to Pan</span>
        </div>
        <app-image-canvas [imageUrl]="state().resultImageUrl || state().previewUrl || ''" />
      } @else {
        <div class="empty-state">
          <p>No image loaded. Please upload a biomedical scan to start inspection.</p>
        </div>
      }
    </div>
  </main>
</div>
